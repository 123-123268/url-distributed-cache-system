<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
<div layout:fragment="content">
    <div class="jumbotron bg-dark p-5 rounded-3 my-4">
        <h1 class="gradient-text">Shorten Here, Share Anywhere!</h1>
    </div>

    <div class="card mt-4 bg-dark">
        <div class="card-header">
            <h5 class="card-title mb-0 text-light">Create Here!</h5>
        </div>

        <div class="card-body">
            <form th:action="@{/short-urls}"
                  method="post"
                  th:object="${createShortUrlForm}">
                <div class="mb-3">
                    <label for="originalUrl"
                           class="form-label text-light">
                        Original URL
                    </label>

                    <input type="url"
                           class="form-control"
                           id="originalUrl"
                           th:field="*{originalUrl}"
                           placeholder="https://example.com/my-long-url"
                           required>

                    <div class="text-danger"
                         th:if="${#fields.hasErrors('originalUrl')}"
                         th:errors="*{originalUrl}">
                    </div>
                </div>

                <button type="submit" class="btn btn-gradient">
                    Shorten URL
                </button>
            </form>
        </div>
    </div>

    <h2 class="mt-5">Shortened URLs</h2>

    <div th:if="${shortUrls.data.isEmpty()}"
         class="alert alert-info bg-dark">
        No URLs have been created yet.
    </div>

    <div th:unless="${shortUrls.data.isEmpty()}"
         class="table-responsive bg-dark">
        <table class="table table-dark table-hover">
            <thead>
            <tr>
                <th>Short URL</th>
                <th>Original URL</th>
                <th>Created</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="url : ${shortUrls.data}">
                <td>
                    <a th:href="@{/s/{key}(key=${url.shortKey})}"
                       th:text="${baseUrl + '/s/' + url.shortKey}"
                       target="_blank"></a>
                </td>

                <td>
                    <a th:href="${url.originalUrl}"
                       th:text="${#strings.abbreviate(url.originalUrl, 50)}"
                       target="_blank"></a>
                </td>

                <td th:text="${#temporals.format(
                    url.createdAt,
                    'yyyy-MM-dd HH:mm'
                )}"></td>
            </tr>
            </tbody>
        </table>

        <div th:insert="~{pagination}"></div>
    </div>
</div>
</body>
</html>
