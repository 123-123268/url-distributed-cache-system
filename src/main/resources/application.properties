spring.application.name=url-shortner

app.base-url=${BASE_URL:http://localhost:8080}
app.default-expiry-in-days=30
app.validate-original-url=true
app.page-size=10

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

logging.level.org.flywaydb=INFO